# Markdown for agents, nginx equivalent of Cloudflare's feature:
# https://developers.cloudflare.com/fundamentals/reference/markdown-for-agents/
#
# AI agents that send `Accept: text/markdown` get the pre-generated .md
# sibling of a page instead of the HTML. Markdown files are built at
# commit time via `npm run build:md` (scripts/build-markdown.js), not
# converted on the fly, since this is a static site with no app server.
#
# Usage: `include /path/to/nginx-agents.conf;` inside the site's `server {}`
# block (after `root` is set), or paste the contents in directly. Requires
# the `map` directive to live in the surrounding `http {}` block, so if this
# site shares a config with others, move the `map` block up to avoid
# "duplicate map variable" errors.

map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

# Content negotiation: rewrite the request to its .md sibling before the
# normal try_files runs, only when the client actually asked for markdown.
if ($wants_markdown) {
    rewrite ^/$ /index.md break;
    rewrite ^/([^./]+)\.html$ /$1.md break;
}

location ~ \.md$ {
    default_type "text/markdown; charset=utf-8";
    add_header Vary Accept always;
}

# Every other response should still vary on Accept, so caches don't serve
# a markdown response to a browser or vice versa.
add_header Vary Accept always;
